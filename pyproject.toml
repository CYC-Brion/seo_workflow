[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-content-automation"
version = "0.1.0"
description = "AI自动化SEO文章生成与发布工作流系统"
readme = "README.md"
authors = [{name = "Your Name", email = "your.email@example.com"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.5.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "python-wordpress-xmlrpc>=2.3",
    "fastapi>=0.104.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    # 以下为代码实际使用但此前遗漏的依赖
    "openpyxl>=3.1.0",   # src/modules/excel_reader、CLI 读取关键词工作簿
    "requests>=2.31.0",  # 关键词扩展、WordPress/WP-API 调用
    "urllib3>=2.0.0",    # 重试策略（HTTPAdapter/Retry）
    "loguru>=0.7.0",     # src/utils/logger.py 的日志实现
    "Pillow>=10.0.0",    # scripts/import_new_editorial_images.py 图片处理
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]
web = [
    "uvicorn>=0.24.0",
]
browser = [
    "playwright>=1.45.0",
]
celery = [
    "celery>=5.3.0",
    "redis>=4.5.0",
]

[project.scripts]
seo-workflow = "src.cli.main:main"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 不再默认生成 HTML 覆盖率报告：它会在仓库根重建 htmlcov/，而 htmlcov/ 是
# 构建产物不入库。需要时手动加 --cov-report=html。
addopts = "-v --cov=src --cov-report=term-missing"
