[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-content-automation"
version = "0.1.0"
description = "AI自动化SEO文章生成与发布工作流系统"
readme = "README.md"
authors = [{name = "Your Name", email = "your.email@example.com"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.8"
# 这份清单按代码里实际 import 的内容逐条核对过，不是按印象罗列。
# 此前声明过但全项目零引用的依赖（fastapi / uvicorn / celery / redis / pydantic）
# 已移除：src/api/ 是个 0 字节空壳，任务调度用的是 apscheduler 而非 celery。
dependencies = [
    # 数据处理
    "pandas>=1.5.0",              # src/modules/excel_reader
    "openpyxl>=3.1.0",            # excel_reader、CLI 读写关键词工作簿
    # AI 模型
    "openai>=1.0.0",              # src/utils/ai_client.py
    "anthropic>=0.25.0",          # src/utils/ai_client.py
    # 网络
    "requests>=2.31.0",           # 关键词扩展、WordPress 调用
    "urllib3>=2.0.0",             # HTTPAdapter/Retry 重试策略
    "requests-oauthlib>=1.3.0",   # scripts/generate_google_ads_refresh_token.py
    # WordPress
    "python-wordpress-xmlrpc>=2.3",  # src/modules/wordpress_integration
    # 调度 / 配置 / 日志
    "apscheduler>=3.10.0",        # src/core/task_scheduler.py
    "python-dotenv>=1.0.0",       # config/settings.py
    "loguru>=0.7.0",              # src/utils/logger.py
    # 图片处理
    "Pillow>=10.0.0",             # scripts/import_new_editorial_images.py
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",   # pyproject 的 addopts 里用了 --cov
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]
# Google Suggest 的浏览器兜底（keyword_expander 里的 try/except 导入）。
# 不装也能跑，只是少一条兜底路径。
browser = [
    "playwright>=1.45.0",
]

[project.scripts]
seo-workflow = "src.cli.main:main"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 不再默认生成 HTML 覆盖率报告：它会在仓库根重建 htmlcov/，而 htmlcov/ 是
# 构建产物不入库。需要时手动加 --cov-report=html。
addopts = "-v --cov=src --cov-report=term-missing"
