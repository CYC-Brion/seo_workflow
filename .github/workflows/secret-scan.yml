name: Secret Scan

# 防复发的那道闸：这个仓库曾经把 .env（Azure key、WordPress 应用密码等）
# 提交进历史并推到了 GitHub，只能靠改写历史 + 轮换凭证收场。
# 有了这个 workflow，下一次含密钥的推送会直接让检查失败，而不是等到
# GitHub 发泄露告警才发现。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须取完整历史。只扫最后一次提交会漏掉"被重新引入的旧密钥"，
          # 而历史泄露正是这个仓库踩过的坑。
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 个人账号免费，无需额外配置。若仓库转为组织所有，需要在
          # Settings → Secrets and variables → Actions 里加 GITLEAKS_LICENSE。
